# Theming
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Font
font_family      JetBrainsMono Nerd Font
font_size 18.0

# Cursor
cursor_shape beam
cursor_trail 1

# Keep some breathing room for a single window, but remove the ugly gaps
# when the window is split into multiple panes.
window_margin_width 0
single_window_margin_width 21.75
window_padding_width 6
single_window_padding_width 10
window_border_width 1
draw_minimal_borders yes
active_border_color   #BC9CE7
inactive_border_color #474648

# No stupid close confirmation
confirm_os_window_close 0

# Launch zsh in kitty
shell /usr/bin/zsh

# Moderate transparency with softer blur so the background stays visible
background_opacity 0.52
dynamic_background_opacity yes

# Make the tab bar readable even with transparency enabled.
tab_bar_style powerline
tab_bar_align left
tab_bar_min_tabs 1
tab_separator " "
active_tab_foreground   #1B1A1C
active_tab_background   #E8D3DD
inactive_tab_foreground #C5B5BE
inactive_tab_background #2D303D
inactive_tab_font_style normal
tab_bar_background      #1B1A1C

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Pane navigation and splits
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+z launch --location=hsplit --cwd=current

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# Tab/session shortcuts
map ctrl+shift+o new_tab_with_cwd
map ctrl+shift+n next_tab
map ctrl+shift+p previous_tab
